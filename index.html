<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý công việc</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="bgLayer" aria-hidden="true"></div>
<div class="note ui-hint">Di chuyển chuột hoặc nhấn phím bất kỳ để hiện thị</div>
<div class="app">
  <aside>
    <div class="brand">Quản lý công việc</div>
    <nav class="nav" aria-label="Điều hướng">
      <button class="active" data-view="dashboard">Tổng quan</button>
      <button data-view="tasks">Công việc</button>
      <button data-view="projects">Dự án</button>
      <button data-view="finance">Tài chính</button>
      <button data-view="health">Sức khỏe</button>
      <button data-view="settings">Cài đặt</button>
    </nav>
    <div class="aside-foot">
      <button class="button" id="maskMoneyBtn" title="Ẩn/hiện toàn bộ số tiền" aria-pressed="false">
        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path class="eye-open" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
          <circle class="eye-open" cx="12" cy="12" r="3"/>
          <g class="eye-off">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </g>
        </svg>
        <span id="maskMoneyLabel">Ẩn số tiền</span>
      </button>
      <button class="button" id="hideUiBtn">Ẩn giao diện</button>
    </div>
  </aside>

  <main>
<!--VIEW:dashboard-->
<!--VIEW:tasks-->
<!--VIEW:projects-->
<!--VIEW:finance-->
<!--VIEW:health-->
<!--VIEW:settings-->
  </main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="button" id="modalCancel">Hủy</button>
      <button class="button primary" id="modalSubmit">Xác nhận</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/js/core.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/calendar.js"></script>
<script src="/js/dnd.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/tasks.js"></script>
<script src="/js/projects.js"></script>
<script src="/js/finance.js"></script>
<script src="/js/focus.js"></script>
<script src="/js/health.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/init.js"></script>
</body>
</html>
